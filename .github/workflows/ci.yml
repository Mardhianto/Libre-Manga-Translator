name: CI

on:
  push:
    branches: [main, master, development]
  pull_request:
    branches: [main, master, development]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run svelte-check & typecheck
        run: bun run check

      - name: Inpaint selfcheck
        run: bun run check:inpaint

      - name: Gate selfcheck
        run: bun run check:gate

      - name: OCR selfcheck
        run: bun run check:ocr

      - name: Security (SSRF) selfcheck
        run: bun run check:security

      - name: Validator selfcheck
        run: bun run check:validator

      - name: Model hash selfcheck
        run: bun run check:hashes

      - name: OCR runtime CSP audit
        run: bun run check:ocr-audit

      # No live-LLM step here on purpose. `tests/live/` (and
      # `playwright.live.config.ts`) need a running model backend, so CI must
      # never boot the mock stub or download Ollama/LM Studio. The mock server
      # used to stay up for a live suite that lived inside `tests/unit/`; that
      # suite now lives in `tests/live/` and is opt-in (`bun run test:live`).
      - name: Run unit tests (no skips allowed)
        shell: bash
        run: |
          set -o pipefail
          bun run test:unit 2>&1 | tee unit.log
          if sed 's/\x1b\[[0-9;]*m//g' unit.log | grep -Eq '^[[:space:]]*[1-9][0-9]* skip'; then
            echo "::error::unit tests reported skipped tests; every suite must run in CI"
            exit 1
          fi

      - name: Build extension
        run: bun run build

      # The only selfcheck that touches the network (HEAD requests to Hugging Face).
      - name: OCR language-pack URL selfcheck
        run: bun run check:ocr-packs

      - name: Install Playwright browser
        run: bunx playwright install --with-deps chromium

      - name: Run E2E tests
        run: bun run test:e2e
